name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  encoding:
    name: encoding guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject non-UTF-8 / BOM / CRLF tracked files
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$(file -b --mime-type "$f")" in
              text/*|application/json|inode/x-empty) ;;
              *) continue ;;
            esac
            if ! iconv -f UTF-8 -t UTF-8 "$f" >/dev/null 2>&1; then
              echo "::error file=$f::not valid UTF-8"; fail=1
            fi
            if [ "$(head -c 3 "$f" | xxd -p)" = "efbbbf" ]; then
              echo "::error file=$f::has a UTF-8 BOM"; fail=1
            fi
            if grep -qU $'\r' "$f"; then
              echo "::error file=$f::contains CRLF line endings"; fail=1
            fi
          done < <(git ls-files)
          exit $fail

  test:
    name: ${{ matrix.compiler }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        compiler: [dmd-latest, ldc-latest]
        exclude:
          # GitHub's macos-latest runners are arm64 and DMD ships no arm64
          # macOS build, so setup-dlang fails before anything is compiled:
          # "the dmd compiler is not supported for non-x64 architecture".
          # Covered by the x64 image below instead, so the DMD/macOS
          # combination stays tested rather than quietly dropped.
          - os: macos-latest
            compiler: dmd-latest
        include:
          - os: macos-13
            compiler: dmd-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: ${{ matrix.compiler }}
      - name: Build
        run: dub build
      - name: Test
        run: dub test
      # Pointers live in registers, dead stores vanish and stack slots get
      # reused only once the optimizer runs; an unoptimized-only test suite
      # cannot see any of it.
      - name: Test (optimized)
        run: dub test --build=unittest-optimized
      # The thread-private ownership checks are asserts, so -release turns them
      # off. `TgcEnforce` keeps them, and that build has to keep compiling --
      # it is the one configuration where the check cannot fall back on the
      # assertion machinery and has to print and abort instead.
      - name: Build with TgcEnforce
        run: dub build --build=release --d-version=TgcEnforce

  # Nothing used to fail when a change made the collector slower, and this
  # project's history is mostly changes that did. Three of the four mark-phase
  # optimizations tried most recently were regressions, all plausible enough to
  # ship. A shared runner cannot resolve the few per cent those turned on -- so
  # this gates on what a shared runner *can* measure: tgc against the default
  # collector on the same machine in the same minute, tgc against itself at a
  # quarter of the live set, and facts that are simply true or false. See the
  # header of bench/gate.sh for the calibration behind each threshold.
  gate:
    name: regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest
      - name: bench/gate.sh
        run: bench/gate.sh

  sanitizers:
    name: ldc / ${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: thread
            build: unittest-tsan
          - sanitizer: address
            build: unittest-asan
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest
      # A garbage collector is exactly the code sanitizers are for: races on
      # cross-thread heap access, and use-after-free from over-eager sweeping.
      #
      # Both are known to pass on Linux/x86-64 with LDC 1.42 -- verified by
      # running them on a real machine before wiring this up, because they
      # cannot run at all on macOS/arm64, where both runtimes are broken for D.
      #
      # The suppressions file covers only what is not tgc's to fix. tgc's own
      # spinlock-guarded structures are annotated in the source with
      # __tsan_acquire/__tsan_release instead, so they stay checked.
      #
      # `detect_leaks=0`, and the reason is not tgc's to fix. Run with leak
      # detection on, LeakSanitizer reports 2112 bytes in two allocations, all
      # of it inside druntime's `core.runtime.defaultTraceHandler`: the
      # backtrace attached to a Throwable that a test catches and drops, which
      # is freed by the Throwable's destructor and so never freed at all, since
      # nothing finalizes the heap at exit. Verified by running the same build
      # against the commit before the collector-teardown work, on the same box:
      # byte-for-byte the same report.
      #
      # Turning it on therefore needs an LSan suppression for that function --
      # the same treatment `.tsan-suppressions` gives druntime's
      # `thread_suspendHandler` -- and a symbolizer in the runner for the
      # suppression to match against. Worth doing; not done blind.
      - name: Test under -fsanitize=${{ matrix.sanitizer }}
        env:
          ASAN_OPTIONS: detect_leaks=0:detect_stack_use_after_return=0
          TSAN_OPTIONS: halt_on_error=1:suppressions=${{ github.workspace }}/.tsan-suppressions
        run: dub test --compiler=ldc2 --build=${{ matrix.build }}
