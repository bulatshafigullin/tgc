name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  encoding:
    name: encoding guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject non-UTF-8 / BOM / CRLF tracked files
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$(file -b --mime-type "$f")" in
              text/*|application/json|inode/x-empty) ;;
              *) continue ;;
            esac
            if ! iconv -f UTF-8 -t UTF-8 "$f" >/dev/null 2>&1; then
              echo "::error file=$f::not valid UTF-8"; fail=1
            fi
            if [ "$(head -c 3 "$f" | xxd -p)" = "efbbbf" ]; then
              echo "::error file=$f::has a UTF-8 BOM"; fail=1
            fi
            if grep -qU $'\r' "$f"; then
              echo "::error file=$f::contains CRLF line endings"; fail=1
            fi
          done < <(git ls-files)
          exit $fail

  test:
    name: ${{ matrix.compiler }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        compiler: [dmd-latest, ldc-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: ${{ matrix.compiler }}
      - name: Build
        run: dub build
      - name: Test
        run: dub test
      # Pointers live in registers, dead stores vanish and stack slots get
      # reused only once the optimizer runs; an unoptimized-only test suite
      # cannot see any of it.
      - name: Test (optimized)
        run: dub test --build=unittest-optimized

  sanitizers:
    name: ldc / ${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: thread
            build: unittest-tsan
          - sanitizer: address
            build: unittest-asan
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest
      # A garbage collector is exactly the code sanitizers are for: races on
      # cross-thread heap access, and use-after-free from over-eager sweeping.
      #
      # NOTE: neither sanitizer has ever been run against this project. Both
      # runtimes are broken for D on the machine it was developed on -- ASan
      # deadlocks inside its own startup and TSan segfaults, both reproducible
      # with a printf("hello") containing none of this code -- so this job is
      # their first real execution. Expect it to need tuning rather than to be
      # green on day one.
      #
      # The flags live in dub.sdl build types because `dub test --dflags=...`
      # is not accepted by dub.
      - name: Test under -fsanitize=${{ matrix.sanitizer }}
        env:
          ASAN_OPTIONS: detect_leaks=0:detect_stack_use_after_return=0
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: dub test --compiler=ldc2 --build=${{ matrix.build }}
